const supportSearchBase = 'https://suporte.intelbras.com.br/central-de-ajuda/busca';
function buildDocLink(product, type) {
  const hint = type === 'manual' ? 'manual' : 'ficha técnica';
  return `${supportSearchBase}?q=${encodeURIComponent(product + ' ' + hint)}`;
}
products.sort((a,b)=>a[0].localeCompare(b[0],'pt-BR',{numeric:true,sensitivity:'base'}));
const months={jan:0,fev:1,mar:2,abr:3,mai:4,jun:5,jul:6,ago:7,set:8,out:9,nov:10,dez:11};
const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear() - 3);
const tbody = document.getElementById('products');
products.forEach(([product,method,phaseout]) => {
  const row = document.createElement('tr');
  const manualLink = buildDocLink(product, 'manual');
  const fichaLink = buildDocLink(product, 'ficha');

  row.innerHTML = `
    <td>${product}</td>
    <td>${method}</td>
    <td>${phaseout}</td>
    <td><a class="doc-link" href="${manualLink}" target="_blank" rel="noopener noreferrer">Abrir</a></td>
    <td><a class="doc-link" href="${fichaLink}" target="_blank" rel="noopener noreferrer">Abrir</a></td>
  `;

  const cell = row.children[2];
  const low = phaseout.toLowerCase();
  if (low.includes('equipamento') && low.includes('linha')) {
    cell.classList.add('phaseout', 'in-line');
  } else {
    const match = low.match(/^(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)\/(\d{2})$/);
    cell.classList.add('phaseout', match && new Date(2000 + Number(match[2]), months[match[1]] + 1, 0) >= cutoff ? 'recent' : 'old');
  }

});

  [...tbody.rows].forEach((row) => {
    row.hidden = !row.textContent.toLowerCase().includes(term);
